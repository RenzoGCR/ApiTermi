<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Tienda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            min-height: 100vh; /* Centra la tarjeta verticalmente en la pantalla */
        }

        .card {
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .card-header {
            background-color: #252525 !important;
            border-bottom: 1px solid #333333;
            padding: 1.5rem;
        }

        .card-body {
            padding: 2rem;
        }

        .form-label {
            color: #a0a0a0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .form-control {
            background-color: #121212;
            border: 1px solid #333333;
            color: #fff;
            border-radius: 8px;
            padding: 0.75rem 1rem;
        }

        .form-control:focus {
            background-color: #121212;
            border-color: #7b61ff;
            box-shadow: 0 0 0 0.25rem rgba(123, 97, 255, 0.25);
            color: #fff;
        }

        .btn-success {
            background-color: #7b61ff;
            border-color: #7b61ff;
            font-weight: 500;
            border-radius: 8px;
            padding: 0.6rem 1.5rem;
            transition: all 0.2s ease;
        }

        .btn-success:hover {
            background-color: #6a4deb;
            border-color: #6a4deb;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(123, 97, 255, 0.3);
        }

        .btn-outline-secondary {
            border-radius: 8px;
            padding: 0.6rem 1.5rem;
            border-color: #444;
            color: #a0a0a0;
        }

        .btn-outline-secondary:hover {
            background-color: #2a2a2a;
            color: #fff;
            border-color: #666;
        }
    </style>
</head>
<body class="container">

<div class="row justify-content-center w-100">
    <div class="col-md-7 col-lg-5">
        <div class="card">
            <div class="card-header text-center">
                <h4 class="card-title mb-0 fw-bold text-white">
                    <i class="bi bi-shop me-2 text-primary" style="color: #7b61ff !important;"></i>
                    <span th:text="${tienda.id == null ? 'Añadir Nueva Tienda' : 'Editar Tienda'}"></span>
                </h4>
            </div>

            <div class="card-body">
                <form th:action="@{/tiendas/guardar}" th:object="${tienda}" method="post">

                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-4">
                        <label for="tienda" class="form-label fw-bold">Nombre de la Tienda</label>
                        <input type="text" id="tienda" th:field="*{tienda}" class="form-control form-control-lg fs-6" required placeholder="Ej: 7Palmas" />
                    </div>

                    <div class="mb-5">
                        <label for="agencia" class="form-label fw-bold">Agencia Asignada</label>
                        <input type="text" id="agencia" th:field="*{agencia}" class="form-control form-control-lg fs-6" placeholder="Ej: Canarias (rhenus)" />
                    </div>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/tiendas}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Volver
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check2 me-1"></i> Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
