<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es"
      data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tiendas | Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .main-header {
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        /* Tabla Estilo Minimal */
        .table {
            --bs-table-bg: transparent;
            --bs-table-color: #e0e0e0;
            --bs-table-border-color: #333;
        }

        thead th {
            background-color: #252525 !important;
            color: #888 !important;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            padding: 15px !important;
        }

        tbody td {
            padding: 15px !important;
            vertical-align: middle;
        }

        /* Botones y Acentos */
        .btn-primary {
            background-color: #7b61ff;
            border-color: #7b61ff;
        }

        .btn-primary:hover {
            background-color: #6a4deb;
            transform: translateY(-1px);
        }

        .btn-action {
            width: 35px;
            height: 35px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: 0.2s;
        }

        /* Filtros */
        .filter-section {
            background-color: #1a1a1a;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #2a2a2a;
        }

        .form-select, .form-control {
            background-color: #252525;
            border: 1px solid #444;
            color: #fff;
        }

        .form-select:focus, .form-control:focus {
            border-color: #7b61ff;
            box-shadow: 0 0 0 0.25rem rgba(123, 97, 255, 0.25);
        }
    </style>
</head>
<body class="container py-5">

<header class="main-header d-flex justify-content-between align-items-center">
    <div>
        <h1 class="mb-0">Gestión de Tiendas</h1>
        <p class="text-secondary small mb-0">Base de datos de tiendas y agencias</p>
    </div>

    <div class="d-flex align-items-center gap-2">
        <a sec:authorize="isAnonymous()" th:href="@{/login}" class="btn btn-outline-light btn-sm">
            <i class="bi bi-person-fill me-1"></i> Iniciar Sesion
        </a>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-outline-danger btn-sm">
                <i class="bi bi-power me-1"></i> Salir (<span sec:authentication="name"></span>)
            </button>
        </form>

        <a sec:authorize="isAuthenticated()" th:href="@{/tiendas/nueva}" class="btn btn-primary btn-sm">
            <i class="bi bi-plus-lg me-1"></i> Nueva Tienda
        </a>
    </div>
</header>

<div class="row g-3 mb-4 align-items-end">
    <div class="col-md-6">
        <form th:action="@{/tiendas}" method="get" id="filterForm" class="filter-section d-flex gap-2 align-items-center">
            <input type="hidden" name="size" th:value="${tamanoActual}">

            <div class="flex-grow-1">
                <label class="small text-secondary d-block mb-1">Filtrar por Agencia</label>
                <select name="agencia" id="agenciaBusqueda" class="form-select form-select-sm">
                    <option value="">Todas las Agencias</option>
                    <option th:each="ag : ${listaAgencias}"
                            th:value="${ag}"
                            th:text="${ag}"
                            th:selected="${ag == agenciaFiltro}">
                    </option>
                </select>
            </div>

            <div class="mt-4 d-flex gap-1">
                <button type="submit" class="btn btn-light btn-sm px-3">Filtrar</button>
                <a th:if="${agenciaFiltro != null and agenciaFiltro != ''}"
                   th:href="@{/tiendas(size=${tamanoActual})}"
                   class="btn btn-outline-secondary btn-sm"><i class="bi bi-x-lg"></i></a>

                <a th:href="@{/tiendas/exportar-pdf(agencia=${agenciaFiltro})}"
                   class="btn btn-outline-info btn-sm" title="Descargar PDF">
                    <i class="bi bi-file-earmark-pdf"></i>
                </a>
            </div>
        </form>
    </div>

    <div class="col-md-6 d-flex justify-content-end gap-3 align-items-center">
        <div class="text-end">
            <label class="small text-secondary d-block mb-1">Registros</label>
            <select class="form-select form-select-sm w-auto"
                    onchange="window.location.href='/tiendas?page=0&size=' + this.value + '&agencia=' + document.getElementById('agenciaBusqueda').value">
                <option th:each="s : ${ {10, 15, 25, 50, 100} }"
                        th:value="${s}" th:text="${s}"
                        th:selected="${tamanoActual == s}"></option>
            </select>
        </div>
    </div>
</div>

<div class="card overflow-hidden">
    <table class="table table-hover table-striped">
        <thead>
        <tr>
            <th>Nombre Tienda</th>
            <th>Agencia / Destino</th>
            <th sec:authorize="isAuthenticated()" class="text-center">Gestión</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tienda : ${tiendas}">
            <td class="text-white fw-bold" th:text="${tienda.tienda}">-</td>
            <td>
                        <span class="badge bg-dark border border-secondary text-secondary fw-normal"
                              th:text="${tienda.agencia != '' ? tienda.agencia : 'Sin Agencia'}"></span>
            </td>
            <td sec:authorize="isAuthenticated()" class="text-center">
                <a th:href="@{/tiendas/editar/{id}(id=${tienda.id})}" class="btn btn-warning btn-action me-1" title="Editar">
                    <i class="bi bi-pencil-square"></i>
                </a>
                <a th:href="@{/tiendas/borrar/{id}(id=${tienda.id})}"
                   class="btn btn-danger btn-action"
                   title="Eliminar"
                   onclick="return confirm('¿Eliminar esta tienda permanentemente?')">
                    <i class="bi bi-trash3"></i>
                </a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(tiendas)}">
            <td th:colspan="${#authorization.expression('isAuthenticated()') ? 3 : 2}" class="text-center py-5">
                <i class="bi bi-search fs-2 d-block mb-2 text-secondary"></i>
                <p class="text-secondary">No se han encontrado resultados.</p>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<nav th:if="${paginaActual.totalPages > 1}" class="mt-4">
    <ul class="pagination pagination-sm justify-content-center">
        <li class="page-item" th:classappend="${paginaActual.first} ? 'disabled'">
            <a class="page-link border-0 bg-dark text-secondary"
               th:href="@{/tiendas(page=${paginaActual.number - 1}, size=${tamanoActual}, agencia=${agenciaFiltro})}">
                <i class="bi bi-chevron-left"></i>
            </a>
        </li>

        <li class="page-item disabled">
                <span class="page-link border-0 bg-transparent text-secondary px-4"
                      th:text="'Página ' + (${paginaActual.number + 1}) + ' de ' + ${paginaActual.totalPages}">
                </span>
        </li>

        <li class="page-item" th:classappend="${paginaActual.last} ? 'disabled'">
            <a class="page-link border-0 bg-dark text-secondary"
               th:href="@{/tiendas(page=${paginaActual.number + 1}, size=${tamanoActual}, agencia=${agenciaFiltro})}">
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
    </ul>
</nav>

</body>
</html>
